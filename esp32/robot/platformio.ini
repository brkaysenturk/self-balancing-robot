[platformio]
default_envs = esp32doit-devkit-v1
src_dir = src
include_dir = include

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -I include
    -D CORE_DEBUG_LEVEL=0
    -O2

lib_deps =
    ; Proje harici agir kutuphaneler yerine saf donanimsal I2C ve FreeRTOS kullanir.

