<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1020" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22272e" stroke-width="0.7"/>
    </pattern>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; fill: #58a6ff; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; fill: #8b949e; }
      .plate-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; fill: #f0883e; font-size: 15px; }
      .plate-sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; fill: #8b949e; font-size: 12px; }
      .dim-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 10px; fill: #79c0ff; }
      .note-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #c9d1d9; }
      .label-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #e6edf3; }
      .outline { fill: #161b22; stroke: #388bfd; stroke-width: 2.5; }
      .tij-hole { fill: #ff7b72; stroke: #f85149; stroke-width: 1.5; }
      .mount-hole { fill: #56d364; stroke: #2ea043; stroke-width: 1.2; }
      .slot { fill: #1c2128; stroke: #d29922; stroke-width: 1.5; stroke-dasharray: 4,2; }
      .cutout { fill: #0d1117; stroke: #f0883e; stroke-width: 2.0; }
      .riser { fill: #13233a; stroke: #58a6ff; stroke-width: 2.0; }
      .dim-line { stroke: #58a6ff; stroke-width: 1.2; stroke-dasharray: 3,3; }
      
      /* Modüllere Özel Canlı Renkli Kutular */
      .driver-box { fill: #14231b; stroke: #3fb950; stroke-width: 2.0; }
      .pdb-box { fill: #1e192c; stroke: #bc8cff; stroke-width: 2.0; }
      .reg-box { fill: #241d14; stroke: #d29922; stroke-width: 2.0; stroke-dasharray: 4,2; }
      .shield-box { fill: #132426; stroke: #14b8a6; stroke-width: 2.0; }
      .imu-box { fill: #261914; stroke: #f0883e; stroke-width: 2.5; }
    </style>
  </defs>

  <!-- Arka Plan & Grid -->
  <rect width="1350" height="1020" fill="#0d1117"/>
  <rect width="1350" height="1020" fill="url(#cadGrid)"/>

  <!-- Başlık Bloğu -->
  <rect x="40" y="20" width="1270" height="75" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="65" y="48" class="title" font-size="20">YTU ÇDTP — İKİ TEKERLEKLİ HASTA DESTEK VE İLAÇ TAŞIMA ROBOTU</text>
  <text x="65" y="72" class="subtitle" font-size="12">GENİŞLETİLMİŞ 4 KATMANLI ŞASİ ŞABLONU (150×100 mm / 15×10 cm Dekota) | 40×20 mm Kablo Bacası | Ölçek: 1:1 Hazır</text>
  <text x="1080" y="48" class="plate-title" font-size="14">TABAKA: 35×50 cm</text>
  <text x="1080" y="70" class="dim-text" font-size="11">Geniş 40×20 mm Kablo Şaftı &amp; Tampon</text>

  <!-- ========================================== -->
  <!-- KATMAN 1: TABAN KATMANI (Sol Üst - 150×100 mm) -->
  <!-- ========================================== -->
  <g transform="translate(60, 125)">
    <text x="0" y="0" class="plate-title">KATMAN 1: TABAN KATMANI (Base Deck - 150×100 mm)</text>
    <text x="0" y="18" class="plate-sub">JGB37 Motor L-Braketleri, TB6612FNG Sürücü &amp; 40×20 mm Kablo Bacası</text>
    
    <rect x="0" y="30" width="500" height="334" rx="16" class="outline"/>
    
    <!-- 4 Köşe M3 Tij Delikleri -->
    <circle cx="20" cy="50" r="7" class="tij-hole"/>
    <circle cx="480" cy="50" r="7" class="tij-hole"/>
    <circle cx="20" cy="344" r="7" class="tij-hole"/>
    <circle cx="480" cy="344" r="7" class="tij-hole"/>
    <text x="35" y="54" class="dim-text" font-size="9">Ø3.4mm Tij</text>
    
    <!-- Sol Motor L-Braket Yuvası (37 mm Braket) -->
    <rect x="30" y="87" width="36" height="220" rx="6" class="slot"/>
    <circle cx="48" cy="107" r="5" class="mount-hole"/>
    <circle cx="48" cy="137" r="5" class="mount-hole"/>
    <circle cx="48" cy="257" r="5" class="mount-hole"/>
    <circle cx="48" cy="287" r="5" class="mount-hole"/>
    <text x="48" y="78" text-anchor="middle" class="label-text" font-weight="bold" font-size="10" fill="#d29922">Sol Motor</text>
    <text x="48" y="197" text-anchor="middle" class="dim-text" font-size="9">L-Braket</text>
    <text x="48" y="322" text-anchor="middle" class="dim-text" font-size="8">M3x10mm</text>
    
    <!-- Sağ Motor L-Braket Yuvası (37 mm Braket) -->
    <rect x="434" y="87" width="36" height="220" rx="6" class="slot"/>
    <circle cx="452" cy="107" r="5" class="mount-hole"/>
    <circle cx="452" cy="137" r="5" class="mount-hole"/>
    <circle cx="452" cy="257" r="5" class="mount-hole"/>
    <circle cx="452" cy="287" r="5" class="mount-hole"/>
    <text x="452" y="78" text-anchor="middle" class="label-text" font-weight="bold" font-size="10" fill="#d29922">Sağ Motor</text>
    <text x="452" y="197" text-anchor="middle" class="dim-text" font-size="9">L-Braket</text>
    <text x="452" y="322" text-anchor="middle" class="dim-text" font-size="8">M3x10mm</text>
    
    <!-- DİKEY KABLO BACASI (40×20 mm -> 133×67 px) -->
    <rect x="183" y="65" width="134" height="67" rx="8" class="riser"/>
    <text x="250" y="94" text-anchor="middle" class="label-text" font-weight="bold" font-size="11" fill="#58a6ff">KABLO BACASI</text>
    <text x="250" y="113" text-anchor="middle" class="dim-text" font-size="10">40×20 mm İç Şaft</text>
    
    <!-- TB6612FNG MOTOR SÜRÜCÜSÜ (TAM ORTADA: cx=250, cy=197) -->
    <rect x="170" y="152" width="160" height="90" rx="8" class="driver-box"/>
    <circle cx="182" cy="164" r="4" class="mount-hole"/>
    <circle cx="318" cy="164" r="4" class="mount-hole"/>
    <circle cx="182" cy="230" r="4" class="mount-hole"/>
    <circle cx="318" cy="230" r="4" class="mount-hole"/>
    <text x="250" y="188" text-anchor="middle" class="label-text" font-weight="bold" font-size="12" fill="#56d364">TB6612FNG SÜRÜCÜ</text>
    <text x="250" y="206" text-anchor="middle" class="dim-text" font-size="10">Motorlara 3cm Kısa Hat</text>
    <text x="250" y="223" text-anchor="middle" class="dim-text" font-size="9" fill="#7ee787">Şasinin Tam Merkezinde</text>
    
    <!-- Ön Şarj Ped Yuvaları -->
    <rect x="175" y="334" width="50" height="22" rx="4" class="cutout" stroke-dasharray="3,2"/>
    <rect x="275" y="334" width="50" height="22" rx="4" class="cutout" stroke-dasharray="3,2"/>
    <text x="200" y="349" text-anchor="middle" class="dim-text" font-size="10">Şarj (+)</text>
    <text x="300" y="349" text-anchor="middle" class="dim-text" font-size="10">Şarj (-)</text>
  </g>

  <!-- ========================================== -->
  <!-- KATMAN 2: GÜÇ & DAĞITIM (Sağ Üst - 150×100 mm) -->
  <!-- ========================================== -->
  <g transform="translate(730, 125)">
    <text x="0" y="0" class="plate-title">KATMAN 2: GÜÇ &amp; DAĞITIM KATMANI (Power Deck)</text>
    <text x="0" y="18" class="plate-sub">3S Li-ion Batarya, KCD11 Switch, 3A Sigorta, XL4016 &amp; Mini PDB</text>
    
    <rect x="0" y="30" width="500" height="334" rx="16" class="outline"/>
    
    <!-- 4 Köşe M3 Tij Delikleri -->
    <circle cx="20" cy="50" r="7" class="tij-hole"/>
    <circle cx="480" cy="50" r="7" class="tij-hole"/>
    <circle cx="20" cy="344" r="7" class="tij-hole"/>
    <circle cx="480" cy="344" r="7" class="tij-hole"/>
    
    <!-- DİKEY KABLO BACASI (40×20 mm -> 133×67 px) -->
    <rect x="183" y="65" width="134" height="67" rx="8" class="riser"/>
    <text x="250" y="94" text-anchor="middle" class="label-text" font-weight="bold" font-size="11" fill="#58a6ff">KABLO BACASI</text>
    <text x="250" y="113" text-anchor="middle" class="dim-text" font-size="10">40×20 mm İç Şaft</text>
    
    <!-- KCD11 Rocker Anahtar (Sol Üst Arka Köşe - Kolay Ulaşılabilir) -->
    <rect x="35" y="65" width="65" height="44" rx="4" class="cutout"/>
    <text x="67" y="86" text-anchor="middle" class="label-text" font-weight="bold" font-size="9" fill="#f0883e">SWITCH</text>
    <text x="67" y="99" text-anchor="middle" class="dim-text" font-size="8">19×13 mm</text>
    
    <!-- 3A Sigorta Yuvası (Sağ Üst Arka Köşe - Kolay Ulaşılabilir) -->
    <circle cx="435" cy="87" r="16" class="cutout"/>
    <text x="435" y="84" text-anchor="middle" class="label-text" font-weight="bold" font-size="9" fill="#f0883e">3A SİGORTA</text>
    <text x="435" y="97" text-anchor="middle" class="dim-text" font-size="8">Ø12.2mm</text>
    
    <!-- 3S 18650 Li-ion Batarya Alanı (TAM ORTADA: Y=157..237, cy=197) -->
    <rect x="125" y="157" width="250" height="80" rx="8" class="shield-box" stroke-dasharray="5,3"/>
    <text x="250" y="192" text-anchor="middle" class="label-text" font-weight="bold" font-size="12" fill="#79c0ff">3S 18650 Li-ion BATARYA</text>
    <text x="250" y="212" text-anchor="middle" class="dim-text" font-size="10">Katman 2 Tam Merkezinde (Dengeli Ağırlık)</text>
    
    <!-- Velcro Kayış Yarıkları -->
    <rect x="100" y="164" width="16" height="8" rx="2" class="cutout"/>
    <rect x="384" y="164" width="16" height="8" rx="2" class="cutout"/>
    <rect x="100" y="214" width="16" height="8" rx="2" class="cutout"/>
    <rect x="384" y="214" width="16" height="8" rx="2" class="cutout"/>
    <text x="75" y="194" text-anchor="middle" class="dim-text" font-size="8">Velcro</text>
    <text x="410" y="194" text-anchor="middle" class="dim-text" font-size="8">Velcro</text>
    
    <!-- MİNİ PDB (Canlı Mor / Eflatun Çerçeve) -->
    <rect x="45" y="252" width="180" height="82" rx="6" class="pdb-box"/>
    <circle cx="57" cy="264" r="4" class="mount-hole"/>
    <circle cx="213" cy="264" r="4" class="mount-hole"/>
    <circle cx="57" cy="322" r="4" class="mount-hole"/>
    <circle cx="213" cy="322" r="4" class="mount-hole"/>
    <text x="135" y="278" text-anchor="middle" class="label-text" font-weight="bold" font-size="11" fill="#bc8cff">MİNİ PDB (Pertinaks)</text>
    <text x="135" y="296" text-anchor="middle" class="dim-text" font-size="10">KF301 Klemensler</text>
    <text x="135" y="312" text-anchor="middle" class="dim-text" font-size="9">100uF Filtre Kondansatörü</text>
    
    <!-- XL4016 8A REGÜLATÖR (Canlı Sarı/Altın Çerçeve) -->
    <rect x="275" y="252" width="180" height="82" rx="6" class="reg-box"/>
    <circle cx="287" cy="264" r="4" class="mount-hole"/>
    <circle cx="443" cy="264" r="4" class="mount-hole"/>
    <circle cx="287" cy="322" r="4" class="mount-hole"/>
    <circle cx="443" cy="322" r="4" class="mount-hole"/>
    <text x="365" y="278" text-anchor="middle" class="label-text" font-weight="bold" font-size="11" fill="#d29922">XL4016 8A REGÜLATÖR</text>
    <text x="365" y="296" text-anchor="middle" class="dim-text" font-size="10">12V Giriş  ➔  5.0V Çıkış</text>
    <text x="365" y="312" text-anchor="middle" class="dim-text" font-size="9">Alüminyum Soğutucu Blok</text>
  </g>

  <!-- ========================================== -->
  <!-- KATMAN 3: KONTROL & BEYİN (Sol Alt - MPU TAM MERKEZDE!) -->
  <!-- ========================================== -->
  <g transform="translate(60, 520)">
    <text x="0" y="0" class="plate-title">KATMAN 3: KONTROL &amp; SENSÖR KATMANI (Brain Deck)</text>
    <text x="0" y="18" class="plate-sub">Merkez MPU-6050 (Denge Ekseni), ESP32 Shield &amp; 2x TSOP2238 IR</text>
    
    <rect x="0" y="30" width="500" height="334" rx="16" class="outline"/>
    
    <!-- 4 Köşe M3 Tij Delikleri -->
    <circle cx="20" cy="50" r="7" class="tij-hole"/>
    <circle cx="480" cy="50" r="7" class="tij-hole"/>
    <circle cx="20" cy="344" r="7" class="tij-hole"/>
    <circle cx="480" cy="344" r="7" class="tij-hole"/>
    
    <!-- DİKEY KABLO BACASI (40×20 mm -> 133×67 px) -->
    <rect x="183" y="65" width="134" height="67" rx="8" class="riser"/>
    <text x="250" y="94" text-anchor="middle" class="label-text" font-weight="bold" font-size="11" fill="#58a6ff">KABLO BACASI</text>
    <text x="250" y="113" text-anchor="middle" class="dim-text" font-size="10">40×20 mm İç Şaft</text>
    
    <!-- ======================================================= -->
    <!-- MPU-6050 SENSÖRÜ: TAM GEOMETRİK MERKEZDE (X=75mm, Y=50mm) -->
    <!-- ======================================================= -->
    <rect x="200" y="158" width="100" height="54" rx="6" class="imu-box"/>
    <circle cx="212" cy="185" r="4" class="mount-hole"/>
    <circle cx="288" cy="185" r="4" class="mount-hole"/>
    <text x="250" y="180" text-anchor="middle" class="label-text" font-weight="bold" font-size="12" fill="#f0883e">MPU-6050 (GY-521)</text>
    <text x="250" y="196" text-anchor="middle" class="dim-text" font-size="10" fill="#ffb787">TAM MERKEZ (X=0, Y=0)</text>
    <text x="250" y="207" text-anchor="middle" class="dim-text" font-size="8" fill="#7ee787">Tekerlek Mil Ekseni Üzerinde</text>
    
    <!-- ======================================================= -->
    <!-- ESP32 38-PIN KLEMENS SHIELD: ÖN BÖLGEDE (Sensörün Hemen Önü) -->
    <!-- ======================================================= -->
    <rect x="125" y="226" width="250" height="74" rx="8" class="shield-box"/>
    <circle cx="137" cy="238" r="4" class="mount-hole"/>
    <circle cx="363" cy="238" r="4" class="mount-hole"/>
    <circle cx="137" cy="288" r="4" class="mount-hole"/>
    <circle cx="363" cy="288" r="4" class="mount-hole"/>
    <text x="250" y="246" text-anchor="middle" class="label-text" font-weight="bold" font-size="12" fill="#2dd4bf">ESP32 38-PIN KLEMENS SHIELD</text>
    <text x="250" y="264" text-anchor="middle" class="dim-text" font-size="10">Vidalı Terminal Blokları (Soketli)</text>
    <text x="250" y="280" text-anchor="middle" class="dim-text" font-size="9" fill="#14b8a6">ESP32-WROOM-32D Modülü</text>
    
    <!-- 85 mm Diferansiyel Ölçü Çizgisi -->
    <line x1="108" y1="310" x2="392" y2="310" class="dim-line"/>
    <line x1="108" y1="305" x2="108" y2="315" class="dim-line"/>
    <line x1="392" y1="305" x2="392" y2="315" class="dim-line"/>
    <text x="250" y="306" text-anchor="middle" class="dim-text" font-size="10" fill="#79c0ff">85 mm Diferansiyel Aralık</text>
    
    <!-- Ön TSOP2238 IR Alıcı Gözleri -->
    <circle cx="108" cy="326" r="9" class="cutout"/>
    <circle cx="392" cy="326" r="9" class="cutout"/>
    <text x="108" y="348" text-anchor="middle" class="dim-text" font-size="10" font-weight="bold" fill="#f0883e">TSOP (Sol)</text>
    <text x="392" y="348" text-anchor="middle" class="dim-text" font-size="10" font-weight="bold" fill="#f0883e">TSOP (Sağ)</text>
  </g>

  <!-- ========================================== -->
  <!-- KATMAN 4: İLAÇ TAŞIMA VE KORUMA PANELİ (Sağ Alt - 150×100 mm) -->
  <!-- ========================================== -->
  <g transform="translate(730, 520)">
    <text x="0" y="0" class="plate-title">KATMAN 4: İLAÇ TAŞIMA VE KORUMA PANELİ (Top Deck)</text>
    <text x="0" y="18" class="plate-sub">Sadece İlaç Kaseti (80×26 mm) &amp; Şarj / Durum LED'i (Sıfır Kablo Karmaşası)</text>
    
    <rect x="0" y="30" width="500" height="334" rx="16" class="outline"/>
    
    <!-- 4 Köşe M3 Tij Delikleri -->
    <circle cx="20" cy="50" r="7" class="tij-hole"/>
    <circle cx="480" cy="50" r="7" class="tij-hole"/>
    <circle cx="20" cy="344" r="7" class="tij-hole"/>
    <circle cx="480" cy="344" r="7" class="tij-hole"/>
    
    <!-- Durum / Şarj Gösterge LED'i (Ø5.0 mm - Ön Kenarda Şık Görünüm) -->
    <circle cx="250" cy="52" r="8" fill="#56d364" stroke="#3fb950" stroke-width="2"/>
    <text x="250" y="40" text-anchor="middle" class="label-text" font-size="10">Durum LEDi (Ø5mm)</text>
    
    <!-- DİKEY KABLO BACASI (Sadece LED kablosu için şık 40×20 mm geçiş) -->
    <rect x="183" y="65" width="134" height="67" rx="8" class="riser"/>
    <text x="250" y="94" text-anchor="middle" class="label-text" font-weight="bold" font-size="11" fill="#58a6ff">KABLO BACASI</text>
    <text x="250" y="113" text-anchor="middle" class="dim-text" font-size="10">40×20 mm İç Şaft</text>
    
    <!-- STANDART ASPİRİN / PAROL İLAÇ KUTUSU CEBİ (TAM ORTADA: Y=145..255, cy=200) -->
    <rect x="85" y="145" width="330" height="110" rx="10" class="cutout" stroke-width="3"/>
    <text x="250" y="185" text-anchor="middle" class="label-text" font-weight="bold" font-size="14" fill="#f0883e">STANDART İLAÇ KUTUSU GÖMÜLÜ CEBİ</text>
    <text x="250" y="212" text-anchor="middle" class="dim-text" font-size="12">80 mm × 26 mm (5 mm Dekota Oyma Kaset)</text>
    <text x="250" y="234" text-anchor="middle" class="dim-text" font-size="11" fill="#7ee787">Aspirin / Parol Kutusu Düşme Önleyici Güvenli Yuva</text>
    
    <text x="250" y="300" text-anchor="middle" class="dim-text" font-size="10" fill="#8b949e">★ Bu Kat Tamamen İlaç Güvenliğine ve Yük Dengesine Ayrılmıştır ★</text>
  </g>

  <!-- ========================================== -->
  <!-- KAPSAMLI VE NET LEJANT ALANI (Alt Kısım) -->
  <!-- ========================================== -->
  <g transform="translate(60, 920)">
    <!-- Çerçeve -->
    <rect x="0" y="0" width="1230" height="65" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    
    <!-- Satır 1 -->
    <g transform="translate(25, 24)">
      <!-- 1. Tij Deliği -->
      <circle cx="0" cy="0" r="6" class="tij-hole"/>
      <text x="15" y="4" class="note-text" font-weight="bold">Ø3.4mm Tij Delikleri:</text>
      <text x="145" y="4" class="note-text" fill="#8b949e">4 Köşeden Geçen Taşıyıcı M3 Çelik Kolonlar</text>
      
      <!-- 2. Montaj Deliği (Yeşil) -->
      <circle cx="480" cy="0" r="5" class="mount-hole"/>
      <text x="495" y="4" class="note-text" font-weight="bold" fill="#56d364">Ø3.2mm M3 Vida Delikleri:</text>
      <text x="655" y="4" class="note-text" fill="#8b949e">Motor Braketleri, Shield, Regülatör Montajı</text>
      
      <!-- 3. Kablo Bacası -->
      <rect x="940" y="-7" width="20" height="14" rx="3" class="riser"/>
      <text x="970" y="4" class="note-text" font-weight="bold" fill="#58a6ff">Kablo Bacası:</text>
      <text x="1055" y="4" class="note-text" fill="#8b949e">40×20 mm Dikey İç Geçiş (Geniş Şaft)</text>
    </g>

    <!-- Satır 2 -->
    <g transform="translate(25, 48)">
      <!-- 4. Lazer Kesim / Boşaltma -->
      <rect x="-8" y="-7" width="18" height="14" rx="3" class="cutout"/>
      <text x="15" y="4" class="note-text" font-weight="bold" fill="#f0883e">Turuncu Çizgiler:</text>
      <text x="120" y="4" class="note-text" fill="#8b949e">Lazer Kesim / Dekota İç Boşaltma (İlaç Cebi, Switch, Sigorta)</text>
      
      <!-- 5. Modül Yerleşim Slotu -->
      <rect x="480" y="-7" width="20" height="14" rx="3" class="slot"/>
      <text x="510" y="4" class="note-text" font-weight="bold" fill="#d29922">Sarı Kesikli Çizgi:</text>
      <text x="620" y="4" class="note-text" fill="#8b949e">Parça Yerleşim Sınırı (L-Braket, Regülatör)</text>
      
      <!-- 6. Ölçü Çizgisi -->
      <line x1="940" y1="0" x2="960" y2="0" class="dim-line"/>
      <text x="970" y="4" class="note-text" font-weight="bold" fill="#79c0ff">Mavi Kesikli Çizgi:</text>
      <text x="1085" y="4" class="note-text" fill="#8b949e">Teknik Ölçü ve Aralık Referansı</text>
    </g>
  </g>
</svg>