<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 980" width="100%" height="100%">
  <defs>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22272e" stroke-width="0.7"/>
    </pattern>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; fill: #58a6ff; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; fill: #8b949e; }
      .plate-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; fill: #f0883e; font-size: 16px; }
      .plate-sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; fill: #c9d1d9; font-size: 12px; }
      .dim-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #79c0ff; }
      .note-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 12px; fill: #8b949e; }
      .label-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #e6edf3; }
      .outline { fill: #161b22; stroke: #388bfd; stroke-width: 2.5; }
      .tij-hole { fill: #ff7b72; stroke: #f85149; stroke-width: 1.5; }
      .mount-hole { fill: #56d364; stroke: #3fb950; stroke-width: 1.2; }
      .slot { fill: #1f242c; stroke: #d29922; stroke-width: 1.8; stroke-dasharray: 4,2; }
      .cutout { fill: #0d1117; stroke: #f0883e; stroke-width: 2.2; }
      .riser { fill: #13233a; stroke: #58a6ff; stroke-width: 2.5; }
      .dim-line { stroke: #58a6ff; stroke-width: 1; stroke-dasharray: 3,3; }
    </style>
  </defs>

  <!-- Arka Plan & Grid -->
  <rect width="1350" height="980" fill="#0d1117"/>
  <rect width="1350" height="980" fill="url(#cadGrid)"/>

  <!-- Başlık Bloğu -->
  <rect x="40" y="20" width="1270" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="65" y="54" class="title" font-size="22">YTU ÇDTP — İKİ TEKERLEKLİ HASTA DESTEK VE İLAÇ TAŞIMA ROBOTU</text>
  <text x="65" y="80" class="subtitle" font-size="13">HİZALI DİKEY KABLO BACASI (SHAFT) SİSTEMİ | Katlar Arası İçten Geçiş | Sıfır Dış Sarkma</text>
  <text x="1080" y="54" class="plate-title" font-size="15">ÖLÇEK: 1:1 HAZIR</text>
  <text x="1080" y="78" class="dim-text">20×30 cm Tabakaya Tam Sığar</text>

  <!-- ========================================== -->
  <!-- KATMAN 1: TABAN KATMANI (Sol Üst) -->
  <!-- ========================================== -->
  <g transform="translate(60, 135)">
    <text x="0" y="0" class="plate-title">KATMAN 1: TABAN KATMANI (Base Deck)</text>
    <text x="0" y="20" class="plate-sub">JGB37 Motor Braketleri, TB6612 Sürücü Modülü &amp; Kablo Bacası</text>
    
    <rect x="0" y="35" width="450" height="316" rx="16" class="outline"/>
    
    <circle cx="20" cy="55" r="7" class="tij-hole"/>
    <circle cx="430" cy="55" r="7" class="tij-hole"/>
    <circle cx="20" cy="331" r="7" class="tij-hole"/>
    <circle cx="430" cy="331" r="7" class="tij-hole"/>
    <text x="35" y="60" class="label-text">M3 Tij (Ø3.4mm)</text>
    
    <!-- Sol Motor Braketi -->
    <rect x="35" y="90" width="35" height="206" rx="6" class="slot"/>
    <circle cx="52" cy="120" r="5" class="mount-hole"/>
    <circle cx="52" cy="150" r="5" class="mount-hole"/>
    <circle cx="52" cy="240" r="5" class="mount-hole"/>
    <circle cx="52" cy="270" r="5" class="mount-hole"/>
    <text x="45" y="200" class="label-text" transform="rotate(-90 45 200)">Sol Motor Braketi (M3)</text>
    
    <!-- Sağ Motor Braketi -->
    <rect x="380" y="90" width="35" height="206" rx="6" class="slot"/>
    <circle cx="398" cy="120" r="5" class="mount-hole"/>
    <circle cx="398" cy="150" r="5" class="mount-hole"/>
    <circle cx="398" cy="240" r="5" class="mount-hole"/>
    <circle cx="398" cy="270" r="5" class="mount-hole"/>
    <text x="390" y="200" class="label-text" transform="rotate(-90 390 200)">Sağ Motor Braketi (M3)</text>
    
    <!-- DİKEY KABLO BACASI (Mavi Vurgulu) -->
    <rect x="170" y="85" width="110" height="42" rx="8" class="riser"/>
    <text x="178" y="110" class="label-text" font-weight="bold" fill="#58a6ff">DİKEY KABLO BACASI</text>
    <text x="185" y="123" class="dim-text">(Katlar Arası Geçiş)</text>
    
    <!-- TB6612 MOTOR SÜRÜCÜSÜ -->
    <rect x="150" y="180" width="150" height="70" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="2"/>
    <circle cx="165" cy="215" r="4" class="mount-hole"/>
    <circle cx="285" cy="215" r="4" class="mount-hole"/>
    <text x="160" y="205" class="label-text" font-weight="bold" fill="#3fb950">TB6612 SÜRÜCÜ</text>
    <text x="165" y="225" class="dim-text">(Motorlara Direkt 3cm)</text>
    
    <!-- Ön Şarj Ped Yuvaları -->
    <rect x="155" y="325" width="50" height="20" rx="4" class="cutout" stroke-dasharray="3,2"/>
    <rect x="245" y="325" width="50" height="20" rx="4" class="cutout" stroke-dasharray="3,2"/>
    <text x="160" y="339" class="dim-text" font-size="10">Şarj (+)</text>
    <text x="250" y="339" class="dim-text" font-size="10">Şarj (-)</text>
  </g>

  <!-- ========================================== -->
  <!-- KATMAN 2: BATARYA & GÜÇ (Sağ Üst) -->
  <!-- ========================================== -->
  <g transform="translate(730, 135)">
    <text x="0" y="0" class="plate-title">KATMAN 2: BATARYA &amp; GÜÇ KATMANI</text>
    <text x="0" y="20" class="plate-sub">Ağırlık Merkezi (CoM = 10cm) &amp; Aynı Hizada Kablo Bacası</text>
    
    <rect x="0" y="35" width="450" height="316" rx="16" class="outline"/>
    
    <circle cx="20" cy="55" r="7" class="tij-hole"/>
    <circle cx="430" cy="55" r="7" class="tij-hole"/>
    <circle cx="20" cy="331" r="7" class="tij-hole"/>
    <circle cx="430" cy="331" r="7" class="tij-hole"/>
    
    <!-- DİKEY KABLO BACASI (Katman 1 ile Birebir Aynı Hizada!) -->
    <rect x="170" y="85" width="110" height="42" rx="8" class="riser"/>
    <text x="178" y="110" class="label-text" font-weight="bold" fill="#58a6ff">DİKEY KABLO BACASI</text>
    <text x="185" y="123" class="dim-text">(Katlar Arası Geçiş)</text>
    
    <!-- Batarya Alanı -->
    <rect x="105" y="150" width="240" height="130" rx="10" fill="#1f242c" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="165" y="215" class="label-text" font-weight="bold" fill="#79c0ff">3S 18650 Li-ion</text>
    <text x="145" y="235" class="dim-text">(Ağırlık Merkezi Tabanı)</text>
    
    <!-- 4 Adet Velcro Kanalı -->
    <rect x="80" y="165" width="18" height="8" rx="2" class="cutout"/>
    <rect x="352" y="165" width="18" height="8" rx="2" class="cutout"/>
    <rect x="80" y="245" width="18" height="8" rx="2" class="cutout"/>
    <rect x="352" y="245" width="18" height="8" rx="2" class="cutout"/>
    
    <!-- XL4015 Step-Down Yuvası -->
    <rect x="150" y="290" width="150" height="50" rx="6" class="slot"/>
    <circle cx="165" cy="315" r="5" class="mount-hole"/>
    <circle cx="285" cy="315" r="5" class="mount-hole"/>
    <text x="175" y="320" class="label-text">XL4015 5A Step-Down</text>
  </g>

  <!-- ========================================== -->
  <!-- KATMAN 3: KONTROL & SENSÖR (Sol Alt) -->
  <!-- ========================================== -->
  <g transform="translate(60, 560)">
    <text x="0" y="0" class="plate-title">KATMAN 3: KONTROL &amp; SENSÖR KATMANI</text>
    <text x="0" y="20" class="plate-sub">ESP32 DevKit V1, İzole MPU-6050 &amp; Aynı Hizada Kablo Bacası</text>
    
    <rect x="0" y="35" width="450" height="316" rx="16" class="outline"/>
    
    <circle cx="20" cy="55" r="7" class="tij-hole"/>
    <circle cx="430" cy="55" r="7" class="tij-hole"/>
    <circle cx="20" cy="331" r="7" class="tij-hole"/>
    <circle cx="430" cy="331" r="7" class="tij-hole"/>
    
    <!-- DİKEY KABLO BACASI (Aynı Hizada!) -->
    <rect x="170" y="85" width="110" height="42" rx="8" class="riser"/>
    <text x="178" y="110" class="label-text" font-weight="bold" fill="#58a6ff">DİKEY KABLO BACASI</text>
    <text x="185" y="123" class="dim-text">(Katlar Arası Geçiş)</text>
    
    <!-- ESP32 Alanı -->
    <rect x="135" y="145" width="180" height="85" rx="8" class="slot"/>
    <circle cx="145" cy="155" r="4" class="mount-hole"/>
    <circle cx="305" cy="155" r="4" class="mount-hole"/>
    <circle cx="145" cy="220" r="4" class="mount-hole"/>
    <circle cx="305" cy="220" r="4" class="mount-hole"/>
    <text x="155" y="195" class="label-text">ESP32 DevKit V1</text>
    
    <!-- MPU-6050 Tam Merkezde -->
    <circle cx="225" cy="265" r="20" fill="#1f242c" stroke="#f0883e" stroke-width="2.5"/>
    <circle cx="200" cy="265" r="4" class="mount-hole"/>
    <circle cx="250" cy="265" r="4" class="mount-hole"/>
    <text x="175" y="255" class="label-text" font-weight="bold" fill="#f0883e">MPU-6050 IMU</text>
    <text x="160" y="275" class="dim-text">(Tam Merkez X=0, Y=0)</text>
    
    <!-- Ön TSOP38 IR Gözleri -->
    <circle cx="95" cy="331" r="9" class="cutout"/>
    <circle cx="355" cy="331" r="9" class="cutout"/>
    <text x="70" y="318" class="dim-text">TSOP (Sol)</text>
    <text x="330" y="318" class="dim-text">TSOP (Sağ)</text>
    <line x1="95" y1="331" x2="355" y2="331" class="dim-line"/>
    <text x="180" y="342" class="dim-text">85 mm Diferansiyel Aralık</text>
  </g>

  <!-- ========================================== -->
  <!-- KATMAN 4: TAŞIMA & İLAÇ CEBİ (Sağ Alt) -->
  <!-- ========================================== -->
  <g transform="translate(730, 560)">
    <text x="0" y="0" class="plate-title">KATMAN 4: TAŞIMA &amp; İLAÇ CEBİ (Top Deck)</text>
    <text x="0" y="20" class="plate-sub">Standart Aspirin/Parol Kaset Yuvası (80×26 mm), Switch &amp; Sigorta</text>
    
    <rect x="0" y="35" width="450" height="316" rx="16" class="outline"/>
    
    <circle cx="20" cy="55" r="7" class="tij-hole"/>
    <circle cx="430" cy="55" r="7" class="tij-hole"/>
    <circle cx="20" cy="331" r="7" class="tij-hole"/>
    <circle cx="430" cy="331" r="7" class="tij-hole"/>
    
    <!-- Mini Switch/LED Kablo Geçiş Yarığı -->
    <rect x="185" y="85" width="80" height="32" rx="6" class="riser"/>
    <text x="195" y="105" class="dim-text">Kablo Girişi</text>
    
    <circle cx="225" cy="65" r="7" fill="#56d364" stroke="#3fb950" stroke-width="2"/>
    <text x="195" y="52" class="label-text">Durum LEDi</text>
    
    <!-- STANDART ASPİRİN / PAROL İLAÇ KUTUSU CEBİ -->
    <rect x="95" y="145" width="260" height="85" rx="8" class="cutout" stroke-width="3"/>
    <text x="125" y="182" class="label-text" font-weight="bold" font-size="14" fill="#f0883e">STANDART İLAÇ KUTUSU CEBİ</text>
    <text x="155" y="205" class="dim-text" font-size="12">80 mm × 26 mm (Düşme Önleyici Kaset)</text>
    <text x="150" y="222" class="dim-text" font-size="11" fill="#7ee787">Aspirin / Parol Karton Kutusu Uyumlu</text>
    
    <rect x="65" y="260" width="75" height="50" rx="4" class="cutout"/>
    <text x="70" y="290" class="label-text">KCD11 Switch</text>
    
    <circle cx="370" cy="285" r="18" class="cutout"/>
    <text x="345" y="260" class="label-text">3A Sigorta</text>
    <text x="330" y="325" class="dim-text">Ø12.2mm Panel Tipi</text>
  </g>

  <!-- ========================================== -->
  <!-- LEJANT VE BİLGİ ALANI (Alt Kısım) -->
  <!-- ========================================== -->
  <g transform="translate(60, 935)">
    <circle cx="15" cy="0" r="6" class="tij-hole"/>
    <text x="30" y="4" class="note-text">Ø3.4mm M3 Tij / Gijon Delikleri (Boydan Boya 4 Kolon)</text>
    
    <rect x="420" y="-8" width="22" height="14" rx="3" class="riser"/>
    <text x="450" y="4" class="note-text">Dikey Kablo Bacası (Katlar Arası İçten Geçiş Şaftı)</text>
    
    <rect x="850" y="-8" width="22" height="14" rx="3" class="cutout"/>
    <text x="880" y="4" class="note-text">Lazer / Dekota İç Boşaltma (İlaç Yuvası, Switch vb.)</text>
  </g>
</svg>