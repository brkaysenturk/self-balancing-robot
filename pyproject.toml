[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self_balancing_robot"
version = "1.0.0"
description = "Autonomous Two-Wheeled Self-Balancing Indoor Patient Support and Medicine Carrier Robot - YTU CDTP"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
authors = [
    { name = "Berkay Senturk" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "optuna>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["self_balancing_robot*"]

[tool.pytest.ini_options]
pythonpath = [".", "webots/controllers/webots_main"]
testpaths = ["tests"]
